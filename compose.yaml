name: paintshop-local-pg18

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: paintshop_admin
      POSTGRES_DB: paintshop
      POSTGRES_PASSWORD_FILE: /run/secrets/paintshop_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - paintshop_pg18_data:/var/lib/postgresql
      - ./docker/postgres/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    secrets:
      - paintshop_admin_password
      - paintshop_migrator_password
      - paintshop_app_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U paintshop_admin -d paintshop"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  paintshop_pg18_data:
    name: paintshop_pg18_data

secrets:
  paintshop_admin_password:
    file: ${HOME}/.local/share/paintshop/secrets/admin
  paintshop_migrator_password:
    file: ${HOME}/.local/share/paintshop/secrets/migrator
  paintshop_app_password:
    file: ${HOME}/.local/share/paintshop/secrets/app

name: paintshop-local

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./PaintShopBackEnd
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DataProtection__KeyPath: /root/.aspnet/DataProtection-Keys
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5027}:8080"
    volumes:
      - ./PaintShopBackEnd/Application:/app/Application
      - ./PaintShopBackEnd/Domain:/app/Domain
      - ./PaintShopBackEnd/Infrastructure:/app/Infrastructure
      - ./PaintShopBackEnd/WebApi:/app/WebApi
      - ./PaintShopBackEnd/Program.cs:/app/Program.cs
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./PaintShopFrontEnd
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./PaintShopFrontEnd/src:/app/src
      - ./PaintShopFrontEnd/public:/app/public
    depends_on:
      - backend

volumes:
  postgres_data:
  data_protection_keys:
